<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReChest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="4.2"/><path d="M10.5 10.5 20 20"/><path d="M15.5 15.5l2.6-2.6"/><path d="M18.5 18.5l2.6-2.6"/></svg></span>
      <span class="word">ReChest</span>
    </div>
    <div class="tabwrap">
      <nav class="tabs" aria-label="Menu"><i class="tab-pill" id="tabPill" aria-hidden="true"></i>
        <button class="tab" data-page="home" title="Overview (1)" aria-label="Overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
        <button class="tab" data-page="player" title="Players (2)" aria-label="Players"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="7.5" r="3.6"/><path d="M2 20c.5-4 3.4-6.5 7-6.5s6.5 2.5 7 6.5z"/><circle cx="17.5" cy="8.5" r="2.8"/><path d="M15.6 13.4c3.4-.6 6 1.6 6.4 5.6h-4.2c-.3-2.2-1-4-2.2-5.6z"/></svg></button>
        <button class="tab" data-page="matches" title="Matches (3)" aria-label="Matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
        <button class="tab" data-page="sim" title="Simulator (4)" aria-label="Simulator"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm1.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm7 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg></button>
        <button class="tab" data-page="map" title="Map (5)" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
      </nav>
      <div class="tablabel" id="tabLabel">Overview</div>
    </div>
    <div class="top-r">
      <button class="iconbtn" data-act="theme" title="Switch theme (T)" aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="mebtn" id="meBtn" data-who="me" title="My profile"><span class="me-dot" id="meDot">?</span><i class="online"></i></button>
      <button class="iconbtn setbtn" data-page="settings" title="Settings (6)" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6a8 8 0 0 1 2 1.2l2.5-.9 1.7 3-2 1.7a8 8 0 0 1 0 2.4l2 1.7-1.7 3-2.5-.9a8 8 0 0 1-2 1.2l-.5 2.6h-3.4l-.5-2.6a8 8 0 0 1-2-1.2l-2.5.9-1.7-3 2-1.7a8 8 0 0 1 0-2.4l-2-1.7 1.7-3 2.5.9a8 8 0 0 1 2-1.2zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button>
      <div class="winbtns" aria-label="Window">
        <button class="wb" data-win="min" title="Minimise" aria-label="Minimise"><svg viewBox="0 0 12 12"><path d="M2.5 6h7"/></svg></button>
        <button class="wb" data-win="max" title="Maximise" aria-label="Maximise"><svg class="i-max" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.6"/></svg><svg class="i-rest" viewBox="0 0 12 12"><rect x="2" y="4" width="6" height="6" rx="1.3"/><path d="M4.2 4V3.4a1.2 1.2 0 0 1 1.2-1.2h3.2a1.2 1.2 0 0 1 1.2 1.2v3.2a1.2 1.2 0 0 1-1.2 1.2H8"/></svg></button>
        <button class="wb close" data-win="close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
      </div>
    </div>
  </header>
  <main class="main" id="main">
    <div class="wrap" id="view"></div>
  </main>
  <div class="keys">
    <button class="kbtn" data-act="theme"><kbd>T</kbd>Theme</button>
    <button class="kbtn" data-act="back"><kbd>Esc</kbd>Back</button>
  </div>
</div>
<div class="rz t" data-edge="t"></div><div class="rz b" data-edge="b"></div><div class="rz l" data-edge="l"></div><div class="rz r" data-edge="r"></div><div class="rz tl" data-edge="tl"></div><div class="rz tr" data-edge="tr"></div><div class="rz bl" data-edge="bl"></div><div class="rz br" data-edge="br"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tip" role="tooltip"></div>

<script src="i18n.js"></script>
<script src="mock-map.js"></script>
<script src="mock.js"></script>
<script src="sim.js"></script>
<script src="map.js"></script>
<script src="features.js"></script>
<script src="app.js"></script>
<script src="update.js"></script>
</body>
</html>
